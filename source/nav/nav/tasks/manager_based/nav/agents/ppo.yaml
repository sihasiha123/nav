algo:
  feature_extractor:
    learning_rate: 0.0005

  actor:
    learning_rate: 0.0005
    clip_ratio: 0.1
    action_limit: 2.0 # m/s

  critic:
    learning_rate: 0.0005
    clip_ratio: 0.1
    value_loss_coefficient: 1.0

  entropy_loss_coefficient: 0.001 # encourage exploration
  gamma: 0.99
  gae_lambda: 0.95
  max_grad_norm: 5.0
  training_frame_num: 32
  training_epoch_num: 4
  num_minibatches: 16 # split into N minibatches
